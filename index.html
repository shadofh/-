<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>من أنا</title>
    <style>
        :root {
            --primary-color: #3498db;
            --accent-color: #f1c40f;
            --bg-color: #2c3e50;
            --text-color: white;
            --panel-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
        }

        h1 { text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin: 5px 0 5px 0; }

        .round-status-bar {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: none; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .main-container {
            display: flex;
            flex-direction: row; 
            align-items: flex-start;
            gap: 20px;
            width: 100%;
            max-width: 1350px;
            justify-content: center;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 200px;
            margin-top: 55px;
            order: 1;
        }

        .scoreboard {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            max-height: 480px;
            overflow-y: auto;
        }

        .team { text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .team:last-child { border-bottom: none; }
        .team h2 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .score { font-size: 2.5rem; font-weight: bold; color: var(--accent-color); margin-bottom: 5px; }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            order: 2;
        }

        #charNameDisplay {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
            height: 2.5rem;
            visibility: hidden;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .stage {
            position: relative;
            width: 500px;
            height: 500px;
            border: 8px solid white;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
            background-color: #000;
        }

        #charImg {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            position: absolute;
            z-index: 1;
        }

        #tilesGrid {
            position: absolute;
            width: 100%;
            height: 100%;
            display: grid;
            z-index: 2;
        }

        .tile {
            background-color: #000;
            border: 1px solid #222;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .tile.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .buzzin-panel {
            display: none; 
            flex-direction: column;
            gap: 12px;
            width: 320px;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            margin-top: 55px;
            order: 3;
        }

        .buzzin-panel h3 { margin: 0 0 5px 0; color: var(--accent-color); font-size: 1.1rem; }

        #buzzinDisplayFrame {
            width: 100%;
            height: 240px;
            border: none;
            border-radius: 10px;
            background: #111;
        }

        .qr-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.95);
            padding: 10px;
            border-radius: 10px;
            color: #333;
            margin-top: 5px;
        }
        .qr-zone span { font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; }
        #qrCodeImg { width: 110px; height: 110px; margin-bottom: 5px; }
        
        .room-display {
            font-size: 1.1rem;
            font-weight: bold;
            background: #2c3e50;
            color: var(--accent-color);
            padding: 3px 15px;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover { transform: scale(1.05); }

        .btn-score { background-color: var(--accent-color); color: #333; margin: 2px; padding: 3px 12px; font-size: 0.85rem;}
        .btn-reveal { background-color: var(--primary-color); color: white; }
        .btn-name { background-color: #9b59b6; color: white; }
        .btn-all { background-color: #e74c3c; color: white; }
        
        .btn-next { 
            background-color: #2ecc71; 
            color: white; 
            font-size: 1.1rem; 
            width: 100%; 
            padding: 12px;
        }

        .settings-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            background: #34495e;
            color: white;
            font-size: 1.3rem;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .settings-panel {
            position: fixed;
            top: 70px;
            left: -320px;
            width: 280px;
            background: #2c3e50;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: left 0.3s ease;
            z-index: 99;
            max-height: 80vh;
            overflow-y: auto;
        }

        .settings-panel.open { left: 15px; }
        .settings-panel h3 { margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; color: var(--accent-color); }
        .setting-group { margin-bottom: 15px; }
        .setting-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: bold;}
        
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: none;
            background: #34495e;
            color: white;
            box-sizing: border-box;
            margin-bottom: 5px;
        }

        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #2ecc71; }
        input:checked + .slider:before { transform: translateX(26px); }

        .team-names-list {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
            max-height: 120px;
            overflow-y: auto;
        }

        .team-name-input-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }
        .team-name-input-wrapper span { font-size: 0.85rem; min-width: 45px; }

        .btn-panel {
            background: #7f8c8d;
            color: white;
            padding: 6px 12px;
            font-size: 0.85rem;
            margin-top: 5px;
            border-radius: 5px;
        }

        #fileInput { display: none; }
        .btn-upload { background-color: var(--primary-color); width: 100%; margin-top: 10px;}

        /* تنسيق صندوق زر القائد الجديد */
        .leader-box {
            background: rgba(241, 196, 15, 0.1);
            border: 2px dashed var(--accent-color);
            border-radius: 10px;
            padding: 12px;
            margin-top: 15px;
            text-align: center;
        }
        .btn-leader-open {
            background-color: var(--accent-color);
            color: #2c3e50;
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <button class="settings-toggle" onclick="toggleSettings()">⚙️</button>

    <div class="settings-panel" id="settingsPanel">
        <h3>إعدادات المسابقة</h3>
        
        <div class="setting-group">
            <div class="switch-container">
                <label style="margin:0;">تفعيل نظام الأزرار:</label>
                <label class="switch">
                    <input type="checkbox" id="buzzerToggle" onchange="toggleBuzzerSystem(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="setting-group" id="roomInputGroup" style="background: rgba(241, 196, 15, 0.1); padding: 10px; border-radius: 8px; display: none;">
            <label style="color:var(--accent-color);">رمز الغرفة:</label>
            <input type="text" id="buzzinRoomInput" placeholder="اكتب رمز الغرفة" onchange="setupBuzzinBuzzer(this.value)">
        </div>
		
        <div class="setting-group">
            <div class="switch-container">
                <label style="margin:0;">تفعيل نظام الجولات:</label>
                <label class="switch">
                    <input type="checkbox" id="roundToggle" onchange="toggleRoundSystem(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
		
        <div class="setting-group" id="roundInputGroup" style="background: rgba(46, 204, 113, 0.1); padding: 10px; border-radius: 8px; display: none;">
            <label style="color:#2ecc71;">إجمالي عدد الجولات:</label>
            <input type="number" id="roundInput" value="3" min="1" onchange="updateRoundSettings()">
            <label style="color:#2ecc71;">عدد الصور لكل جولة:</label>
            <input type="number" id="imageInput" value="5" min="1" onchange="updateRoundSettings()">
            <button class="btn-panel" style="background:#2ecc71; width:100%; margin-top:5px;" onclick="resetGameWithRounds()">تطبيق وبدء مسابقة جديدة</button>
        </div>

        <div class="setting-group">
            <label>حجم شبكة المربعات (المستوى):</label>
            <select id="gridSizeSelect" onchange="changeGridSize(this.value)">
                <option value="3">سهل (3 × 3)</option>
                <option value="4" selected>متوسط (4 × 4)</option>
                <option value="5">صعب (5 × 5)</option>
            </select>
        </div>

        <div class="setting-group">
            <label>إدارة الفرق وتسميتها:</label>
            <div style="display:flex; gap:5px;">
                <button class="btn-panel" style="background:#2ecc71; flex:1;" onclick="addTeam()">إضافة</button>
                <button class="btn-panel" style="background:#c0392b; flex:1;" onclick="removeTeam()">حذف</button>
            </div>
            <div class="team-names-list" id="teamNamesInputsContainer"></div>
        </div>

        <div class="setting-group" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
            <label>تجربة صورة خارجية:</label>
            <input type="file" id="fileInput" accept="image/*" onchange="previewExternalFile()">
            <button class="btn-upload" onclick="document.getElementById('fileInput').click()">رفع وتجربة صورة</button>
        </div>
		<div class="qr-zone" id="qrZone" style="display: none; flex-direction: column; align-items: center; margin: 20px auto; text-align: center;">
    <h3 style="color: #f1c40f; margin-bottom: 10px;">امسح بالجوال لمتابعة الإجابات</h3>
    <img id="qrCodeImg" src="" alt="QR Code" style="border: 5px solid white; border-radius: 10px; background: white;">
</div>

        <div class="leader-box">
            <label style="color: var(--accent-color); font-weight: bold;">قائمة الإجابات الذكية للقائد</label>
            <button class="btn-leader-open" onclick="openLeaderPanel()">اضغطي لفتح جدول الإجابات️</button>
            <small style="font-size:0.75rem; color:#bdc3c7; display:block; margin-top:5px; line-height:1.3;">سيفتح جدولاً تفاعلياً بالترتيب الحالي مع ميزة التشطيب الذكي دون إنترنت.</small>
        </div>
		
		
    </div>

    <h1>خمن الشخصية</h1>
    
    <div class="round-status-bar" id="roundStatusBar">الجولة 1 من 3 ـــ الصورة 1 من 5</div>

    <div class="main-container">
        
        <div class="side-panel">
            <div class="scoreboard" id="scoreboardContainer"></div>
            <button class="btn-next" onclick="nextCharacter()">الشخصية التالية </button>
        </div>

        <div class="game-area">
            <div id="charNameDisplay">الاسم يظهر هنا</div>

            <div class="stage">
                <img src="" id="charImg">
                <div id="tilesGrid"></div>
            </div>

            <div class="controls">
                <button class="btn-reveal" onclick="revealPiece()">كشف قطعة </button>
                <button class="btn-name" onclick="showName()">كشف الاسم </button>
                <button class="btn-all" onclick="revealAll()">كشف الكل </button>
            </div>
        </div>

        <div class="buzzin-panel" id="buzzinPanelVisual">

            <iframe src="about:blank" id="buzzinDisplayFrame"></iframe>
            
            <div class="qr-zone" id="qrZone" style="display: none;">

                <img src="" id="qrCodeImg" alt="QR Code">
                <div class="room-display" id="roomCodeDisplay">000000</div>
			
            </div>
        </div>

			"محمد_العويس.jpg","رجب_طيب_إردوغان.jpg","بوب_روس.jpg","حمود_الخضر.jpg","محمد_أبوتريكة.jpg",
			"ماهر_المعيقلي.jpg","جوردن_رامزي.jpg","خالد_الفيصل.jpg","محمود_الحصري.jpg","محمد_أيوب.jpg",
			"عبدالعزيز_الصميلي.jpg","كلود_مونيه.jpg"
        ];

        // 1. توليد رمز الجلسة العشوائي من 4 أرقام (مثال: 7241)
        const gameSessionSeed = Math.floor(1000 + Math.random() * 9000);

        // 2. دالة التوليد العشوائي المعتمدة على الرمز لضمان التطابق
        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // 3. ترتيب مصفوفة الأسماء في اللعبة بناءً على رمز الجلسة الحالي
        let initialSeed = gameSessionSeed;
        if(characters.length > 0) {
            characters.sort(() => seededRandom(initialSeed++) - 0.5);
        }

        // ==========================================
        // منظومة الـ QR كود الخفيفة والذكية برمز الجلسة فقط
        // ==========================================
        function openLeaderPanel() {
            // رابط صفحتكِ على قيت هب (ضعي رابطكِ الفعلي بدلاً من هذا)
            const githubLeaderboardUrl = `https://shadofh.github.io/answers-list/index.html?session=${gameSessionSeed}`;

            // توليد الـ QR كود بالرابط الصغير جداً (مستحيل يعطي خطأ URI Too Long)
            const qrImgElement = document.getElementById("qrCodeImg");
            const qrZoneElement = document.getElementById("qrZone");
            
            if (qrImgElement) {
                qrImgElement.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(githubLeaderboardUrl)}`;
                if (qrZoneElement) qrZoneElement.style.display = "flex";
                alert(`تم توليد الـ QR بنجاح للجلسة رقم: ${gameSessionSeed}`);
            }

            // فتح لوحة الإجابات في اللابتوب أيضاً للتأكيد
            window.open(githubLeaderboardUrl, "_blank");
        }
        let currentImgIndex = 0;
        let visibleTiles = [];
        let isTestMode = false;
        let testImageSrc = "";
        let testImageName = "";
        
        let teamsData = [
            { name: "الفريق الأول", score: 0 },
            { name: "الفريق الثاني", score: 0 }
        ]; 

        let isRoundSystemActive = false;
        let totalRounds = 3;
        let imagesPerRound = 5;
        let currentRound = 1;
        let currentImageInRound = 1;

        const gridElement = document.getElementById('tilesGrid');
        const imgElement = document.getElementById('charImg');
        const nameDisplay = document.getElementById('charNameDisplay');
        const statusBar = document.getElementById('roundStatusBar');

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
        }

        function toggleBuzzerSystem(isEnabled) {
            const inputGroup = document.getElementById('roomInputGroup');
            const sidePanelVisual = document.getElementById('buzzinPanelVisual');
            const displayFrame = document.getElementById('buzzinDisplayFrame');
            const roomCodeInput = document.getElementById('buzzinRoomInput').value.trim();
            
            if (isEnabled) {
                inputGroup.style.display = "block";
                sidePanelVisual.style.display = "flex";
                if (displayFrame.src === "about:blank" || displayFrame.src === "") {
                    displayFrame.src = "https://www.multibuzz.app";
                }
                if (roomCodeInput) setupBuzzinBuzzer(roomCodeInput);
            } else {
                inputGroup.style.display = "none";
                sidePanelVisual.style.display = "none";
                displayFrame.src = "about:blank";
            }
        }
		
        function toggleRoundSystem(isEnabled){
            const inputGroup = document.getElementById('roundInputGroup');
            isRoundSystemActive = isEnabled;
            if (isEnabled) {
                inputGroup.style.display = "block";
                statusBar.style.display = "block";
                updateStatusBar();
            } else {
                inputGroup.style.display = "none";
                statusBar.style.display = "none";
            }
        }

        function updateRoundSettings() {
            totalRounds = parseInt(document.getElementById('roundInput').value) || 3;
            imagesPerRound = parseInt(document.getElementById('imageInput').value) || 5;
            updateStatusBar();
        }

        function resetGameWithRounds() {
            currentRound = 1;
            currentImageInRound = 1;
            currentImgIndex = 0;
            characters.sort(() => Math.random() - 0.5);
            teamsData.forEach(team => team.score = 0);
            renderScoreboard();
            updateStatusBar();
            refreshCurrentStage();
            toggleSettings(); 
            alert("تم بدء مسابقة جديدة وتحديث ترتيب جدول إجابات القائد!");
        }

        function updateStatusBar() {
            if (isRoundSystemActive) {
                statusBar.innerText = `الجولة ${currentRound} من ${totalRounds} | الصورة ${currentImageInRound} من ${imagesPerRound}`;
            }
        }

        function setupBuzzinBuzzer(roomCode) {
            const qrZone = document.getElementById('qrZone');
            const qrImg = document.getElementById('qrCodeImg');
            const roomDisplay = document.getElementById('roomCodeDisplay');
            roomCode = roomCode.trim();
            if (!roomCode) {
                qrZone.style.display = "none";
                return;
            }
            roomDisplay.innerText = roomCode;
            const playerUrl = `https://www.multibuzz.app/${roomCode}`;
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(playerUrl)}`;
            qrZone.style.display = "flex";
        }

        function changeGridSize(size) {
            GRID_SIZE = parseInt(size);
            refreshCurrentStage();
        }

        function renderScoreboard() {
            const scoreboardContainer = document.getElementById('scoreboardContainer');
            const inputsContainer = document.getElementById('teamNamesInputsContainer');
            scoreboardContainer.innerHTML = '';
            inputsContainer.innerHTML = '';
            
            teamsData.forEach((team, index) => {
                const teamDiv = document.createElement('div');
                teamDiv.className = 'team';
                teamDiv.innerHTML = `
                    <h2>${team.name}</h2>
                    <div class="score" id="score-${index}">${team.score}</div>
                    <button class="btn-score" onclick="changeTeamScore(${index}, 1)">+1</button>
                    <button class="btn-score" onclick="changeTeamScore(${index}, -1)">-1</button>
                `;
                scoreboardContainer.appendChild(teamDiv);

                const inputWrapper = document.createElement('div');
                inputWrapper.className = 'team-name-input-wrapper';
                inputWrapper.innerHTML = `
                    <span>فريق ${index+1}:</span>
                    <input type="text" value="${team.name}" oninput="updateTeamName(${index}, this.value)" placeholder="اسم الفريق">
                `;
                inputsContainer.appendChild(inputWrapper);
            });
        }

        function updateTeamName(index, newName) {
            teamsData[index].name = newName || `الفريق ${index + 1}`;
            const teamHeaders = document.querySelectorAll('.team h2');
            if(teamHeaders[index]) teamHeaders[index].innerText = teamsData[index].name;
        }

        function addTeam() {
            teamsData.push({ name: `الفريق ${teamsData.length + 1}`, score: 0 });
            renderScoreboard();
        }

        function removeTeam() {
            if(teamsData.length > 1) {
                teamsData.pop();
                renderScoreboard();
            }
        }

        function changeTeamScore(teamIndex, amount) {
            teamsData[teamIndex].score = Math.max(0, teamsData[teamIndex].score + amount);
            document.getElementById(`score-${teamIndex}`).innerText = teamsData[teamIndex].score;
        }

        function previewExternalFile() {
            const file = document.getElementById('fileInput').files[0];
            const reader = new FileReader();
            reader.onloadend = function() {
                isTestMode = true;
                testImageSrc = reader.result;
                testImageName = file.name.split('.')[0].replace(/[_-]/g, ' ');
                refreshCurrentStage();
                toggleSettings(); 
            }
            if (file) reader.readAsDataURL(file);
        }

        function getCleanName() {
            if (isTestMode) {
                return testImageName;
            } else {
                if(characters.length > 0) {
                    return characters[currentImgIndex].split('.')[0].replace(/[_-]/g, ' ');
                }
                return "لا توجد صور";
            }
        }

        function refreshCurrentStage() {
            if (isTestMode) {
                imgElement.src = testImageSrc;
            } else {
                imgElement.src = characters.length > 0 ? 'images/' + characters[currentImgIndex] : '';
            }

            nameDisplay.style.visibility = 'hidden'; 
            gridElement.innerHTML = '';
            visibleTiles = [];
            
            gridElement.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 1fr)`;
            gridElement.style.gridTemplateRows = `repeat(${GRID_SIZE}, 1fr)`;

            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.id = `tile-${i}`;
                gridElement.appendChild(tile);
                visibleTiles.push(i); 
            }

            setTimeout(() => { revealPiece(); }, 500); 
        }

        function revealPiece() {
            if (visibleTiles.length === 0) return;
            const randomIndex = Math.floor(Math.random() * visibleTiles.length);
            const tileId = visibleTiles.splice(randomIndex, 1)[0];
            const el = document.getElementById(`tile-${tileId}`);
            if(el) el.classList.add('hidden');
        }

        function revealAll() {
            document.querySelectorAll('.tile').forEach(tile => tile.classList.add('hidden'));
            visibleTiles = [];
        }

        function showName() {
            nameDisplay.innerText = getCleanName();
            nameDisplay.style.visibility = 'visible';
            revealAll(); 
        }

        function nextCharacter() {
            isTestMode = false; 
            if (isRoundSystemActive) {
                if (currentImageInRound < imagesPerRound) {
                    currentImageInRound++;
                    advanceImageIndex();
                } else {
                    if (currentRound < totalRounds) {
                        alert(`انتهت الجولة ${currentRound}! استعدوا للجولة رقم ${currentRound + 1}.`);
                        currentRound++;
                        currentImageInRound = 1;
                        advanceImageIndex();
                    } else {
                        announceFinalWinner();
                        return; 
                    }
                }
                updateStatusBar();
            } else {
                advanceImageIndex();
            }
        }

        function advanceImageIndex() {
            if(characters.length > 0) {
                currentImgIndex = (currentImgIndex + 1) % characters.length;
            }
            refreshCurrentStage();
        }

        function announceFinalWinner() {
            revealAll();
            let winnerText = "انتهت المسابقة بالكامل! \n\nالنتائج النهائية:\n";
            let highestScore = -1;
            let winners = [];

            teamsData.forEach(team => {
                winnerText += `• ${team.name}: ${team.score} نقطة\n`;
                if (team.score > highestScore) {
                    highestScore = team.score;
                    winners = [team.name];
                } else if (team.score === highestScore && highestScore > 0) {
                    winners.push(team.name);
                }
            });

            if (highestScore <= 0) {
                winnerText += "\n تعادل سلبي! لا توجد نقاط محتسبة للفرق.";
            } else if (winners.length === 1) {
                winnerText += `\n الفائز بالمسابقة هو: ${winners[0]}`;
            } else {
                winnerText += `\n تعادل: ( ${winners.join(" و ")} )`;
            }
            alert(winnerText);
        }

        // ==========================================
        // منظومة فتح نافذة الإجابات المنفصلة للقائد
        // ==========================================
        // ==========================================
        // منظومة توليد QR Code وفتح نافذة الإجابات الذكية لـ GitHub
        // ==========================================
        function openLeaderPanel() {
            // 1. استخراج الأسماء بالترتيب الحالي الفعلي المخلوط في الجلسة الحالية
            const cleanNamesList = characters.map(img => img.split('.')[0].replace(/[_-]/g, ' '));
            
            // 2. ضغط وتشفير مصفوفة الأسماء كاملة إلى نص محمي وقصير ليوضع في الرابط بأمان
            const jsonString = JSON.stringify(cleanNamesList);
            const compressedData = btoa(encodeURIComponent(jsonString));

            // 3. رابط صفحتكِ الجديدة المرفوعة على GitHub Pages (استبدلي المعطيات برابطك الفعلي بعد الرفع)
            const githubLeaderboardUrl = `https://shadofh.github.io/answers-list/index.html?session=${gameSessionSeed}`;

            // 4. توليد الـ QR كود وعرضه في واجهة التحكم للـ Buzzin (باستخدام نفس السطر الشغال عندك تماماً)
            // قمت هنا بربطه بـ qrCodeImg المتواجد في كودك ليظهر بوضوح للقائد
            const qrImgElement = document.getElementById("qrCodeImg");
            const qrZoneElement = document.getElementById("qrZone");
            
            if (qrImgElement) {
                // توليد الصورة برابط الـ GitHub المدمج بالأسماء بالملي ثانية
                qrImgElement.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(githubLeaderboardUrl)}`;
                
                // إظهار منطقة الـ QR لو كانت مخفية
                if (qrZoneElement) qrZoneElement.style.display = "flex";
                
                alert("تم تحديث وتوليد الـ QR كود بنجاح! يمكن للقائد الآن مسحه بالجوال لمتابعة التشطيب الذكي بنفس الترتيب العشوائي الحالي.");
            }

            // 5. فتحها كصفحة عادية ومستقلة على اللابتوب أيضاً برابط الـ GitHub لضمان المرونة
            const leaderWindow = window.open(githubLeaderboardUrl, "_blank");
            if (!leaderWindow) {
                alert("تنبيه: يرجى السماح للمتصفح بفتح النوافذ المنبثقة (Pop-ups) لتتمكن من رؤية جدول الإجابات على اللابتوب.");
            }
        }

        renderScoreboard();
        refreshCurrentStage();
    </script>
</body>
</html>
